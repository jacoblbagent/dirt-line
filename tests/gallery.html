<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>Model gallery — Dirt Line</title>
<style>
  html, body { margin: 0; height: 100%; background: #10151b; color: #dfe8f0;
               font: 12px/1.45 ui-monospace, monospace; overflow: hidden; }
  #report { position: fixed; left: 8px; top: 8px; width: 340px; max-height: 60vh; overflow: auto;
            background: #0b0f14dd; border: 1px solid #ffffff22; border-radius: 4px;
            padding: 8px; white-space: pre; z-index: 5; }
  #report.hide { display: none; }
  .bad { color: #ff8f7a; } .ok { color: #7fe0a3; }
</style>
<script>
  window.onerror = (m, u, l, c, e) => {
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:0;right:0;top:0;background:#b3261e;color:#fff;padding:10px;font:12px monospace;z-index:9;white-space:pre-wrap';
    b.textContent = 'ERROR ' + m + '\n' + (e && e.stack ? e.stack : '');
    document.body.appendChild(b);
  };
</script>
</head>
<body>
<pre id="report">building…</pre>
<script type="module">
  import * as THREE from '../three.module.js';
  window.THREE = THREE;
  const { makeMaterials, groupFromParts } = await import('../js/materials.js');
  const { mergeGeos } = await import('../js/geo.js');
  const { TOOL_MODELS, buildGloveHand } = await import('../js/models-tools.js');
  const P = await import('../js/models-props.js');
  const PL = await import('../js/models-plants.js');

  const materials = makeMaterials();
  const report = [];
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x141a22);
  const cam = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 400);
  scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x4a4032, 0.75));
  const key = new THREE.DirectionalLight(0xfff5e6, 2.1);
  key.position.set(6, 11, 7);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x9fc4ff, 0.55);
  rim.position.set(-7, 5, -8);
  scene.add(rim);

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(90, 90),
    new THREE.MeshStandardMaterial({ color: 0x6f6c64, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // grid: 3 columns x 10 rows, 3.6 m pitch, z from -9 to +18
  const COLS = 3, PITCH = 3.6, COLX = [-PITCH, 0, PITCH];
  const items = [];
  const push = (name, build, scale = 1, yaw = 0) => items.push({ name, build, scale, yaw });

  push('spade', () => groupFromParts(TOOL_MODELS.spade(), materials), 1, 0.45);
  push('flathead', () => groupFromParts(TOOL_MODELS.flathead(), materials), 1, 0.45);
  push('pickaxe', () => groupFromParts(TOOL_MODELS.pickaxe(), materials), 1, -0.45);
  push('rake', () => groupFromParts(TOOL_MODELS.rake(), materials), 1, 0.35);
  push('glove + grip', () => groupFromParts(buildGloveHand(1), materials), 1, -0.35);
  push('wheelbarrow', () => groupFromParts(P.buildWheelbarrow(), materials), 1, 0.85);
  push('bucket', () => groupFromParts(P.buildBucket(), materials), 1, 0.5);
  push('cooler', () => groupFromParts(P.buildCooler(), materials), 1, 0.65);
  push('jug', () => groupFromParts(P.buildJug(), materials), 1, -0.5);
  push('trash bag', () => groupFromParts(P.buildTrashBag(), materials), 1, 0.2);
  push('plank', () => groupFromParts(P.buildPlank(1.9, 0.24, 0.035, 3), materials), 1, 0.6);
  push('plank broken', () => groupFromParts(P.buildPlank(1.6, 0.22, 0.03, 9, { broken: true }), materials), 1, -0.55);
  push('pine x7', () => groupFromParts(PL.buildPine(101), materials), 7, 0);
  push('broadleaf x8', () => groupFromParts(PL.buildBroadleaf(211), materials), 8, 0);
  push('birch x9', () => groupFromParts(PL.buildBroadleaf(307, { pale: true }), materials), 9, 0);
  push('snag x7', () => groupFromParts(PL.buildSnag(403), materials), 7, 0);
  push('rock boulder', () => groupFromParts(PL.buildRock(11, 'boulder'), materials), 1.3, 0.4);
  push('rock flat', () => groupFromParts(PL.buildRock(23, 'flat'), materials), 1.3, -0.3);
  push('rock shard', () => groupFromParts(PL.buildRock(37, 'shard'), materials), 1.3, 0.9);
  push('log', () => groupFromParts(PL.buildLog(53, 2.6, 0.20), materials), 1, 0.5);
  push('log torn', () => groupFromParts(PL.buildLog(67, 2.2, 0.17, { torn: true }), materials), 1, -0.7);
  push('stump', () => groupFromParts(PL.buildStump(71, 0.34, 0.42), materials), 1, 0.2);
  push('stump roots', () => groupFromParts(PL.buildStump(83, 0.28, 0.34), materials), 1, 1.1);
  push('dirt heap', () => groupFromParts(new Map([['bark', P.buildDirtHeap(0.6, 21)]]), materials), 1, 0);
  push('plan lip', () => groupFromParts(new Map([['wood', P.buildJumpProfile('lip')]]), materials), 2.2, 0);
  push('plan table', () => groupFromParts(new Map([['wood', P.buildJumpProfile('table')]]), materials), 2.2, 0);
  push('plan roller', () => groupFromParts(new Map([['wood', P.buildJumpProfile('roller')]]), materials), 2.2, 0);
  push('plan landing', () => groupFromParts(new Map([['wood', P.buildJumpProfile('landing')]]), materials), 2.2, 0);
  push('plan berm', () => groupFromParts(new Map([['wood', P.buildJumpProfile('berm')]]), materials), 2.2, 0);
  push('plan pit', () => groupFromParts(new Map([['wood', P.buildJumpProfile('pit')]]), materials), 2.2, 0);

  const PITCH_Z = 8.0, ROW0 = -36;
  const pos = i => ({
    x: COLX[i % COLS],
    z: ROW0 + Math.floor(i / COLS) * PITCH_Z,
  });

  const labels = [];
  function label(text, x, y, z, w = 1.5) {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 80;
    const ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(6,10,14,0.78)';
    ctx.fillRect(0, 0, 512, 80);
    ctx.fillStyle = '#d8ecff';
    ctx.font = '600 46px ui-monospace, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, 256, 44);
    const tex = new THREE.CanvasTexture(c);
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    spr.scale.set(w, w * 0.156, 1);
    spr.position.set(x, y, z);
    spr.renderOrder = 200;
    scene.add(spr);
    return spr;
  }
  window.__labels = (v) => labels.forEach(l => { l.visible = v; });

  // tools are modelled with the origin at the grip, so lift them clear of the floor
  const LIFT = { spade: 0.76, flathead: 0.72, pickaxe: 0.20, rake: 0.45, 'glove + grip': 0.20 };
  const built = [];
  items.forEach((it, i) => {
    const { x, z } = pos(i);
    let g;
    try { g = it.build(); }
    catch (e) { report.push([it.name, 'BUILD ERROR ' + e.message, false]); return; }
    g.scale.setScalar(it.scale);
    g.rotation.y = it.yaw;
    g.position.set(x, LIFT[it.name] || 0, z);
    scene.add(g);
    built[i] = g;
    let verts = 0, nan = 0, tris = 0;
    g.traverse(o => {
      if (!o.isMesh) return;
      const p = o.geometry.getAttribute('position');
      verts += p.count;
      tris += (o.geometry.index ? o.geometry.index.count : p.count) / 3;
      for (let k = 0; k < p.count; k++) {
        if (!isFinite(p.getX(k)) || !isFinite(p.getY(k)) || !isFinite(p.getZ(k))) nan++;
      }
    });
    report.push([it.name, `${verts} v / ${tris | 0} tri`, nan === 0]);
    if (nan) console.error('NaN in ' + it.name + ' x' + nan);
    labels.push(label(it.name, x, it.scale > 3 ? it.scale * 1.04 : 1.25, z, it.scale > 3 ? 2.6 : 1.5));
  });

  const el = document.getElementById('report');
  el.innerHTML = report.map(([n, d, ok]) =>
    `<span class="${ok ? 'ok' : 'bad'}">${ok ? 'OK ' : 'BAD'}</span> ${n.padEnd(14)} ${d}`).join('\n')
    + `\n\n${report.filter(r => r[2]).length}/${report.length} models clean`;
  window.__report = (v) => el.classList.toggle('hide', !v);

  // ---- per-row cameras (10 rows of 3) ------------------------------------
  const ROWCAM = {
    0: { y: 1.9, d: 6.6, look: 0.55 }, 1: { y: 2.0, d: 6.6, look: 0.55 },
    2: { y: 1.9, d: 6.4, look: 0.5 }, 3: { y: 1.7, d: 6.4, look: 0.35 },
    4: { y: 6.5, d: 13.5, look: 4.6 }, 5: { y: 5.4, d: 11.5, look: 3.4 },
    6: { y: 2.2, d: 6.6, look: 0.5 }, 7: { y: 2.2, d: 6.6, look: 0.5 },
    8: { y: 3.2, d: 8.0, look: 0.9 }, 9: { y: 3.2, d: 8.0, look: 0.9 },
  };
  window.setView = (name) => {
    if (name.startsWith('one')) {
      const i = +name.slice(3);
      const g = built[i];
      if (!g) return;
      scene.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(g);
      const size = box.getSize(new THREE.Vector3());
      const c = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z, 0.25);
      const vfov = cam.fov * Math.PI / 180;
      const dist = (maxDim * 0.5) / Math.tan(vfov / 2) * 1.25;
      cam.position.set(c.x + dist * 0.35, c.y + maxDim * 0.28, c.z + dist * 0.95);
      cam.lookAt(c);
      cam.updateProjectionMatrix();
      window.__cur = i;
      return;
    }
    if (name.startsWith('row')) {
      const r = +name.slice(3);
      const z = ROW0 + r * PITCH_Z;
      const c = ROWCAM[r];
      cam.position.set(0, c.y, z + c.d);
      cam.lookAt(0, c.look, z);
      cam.fov = 44;
    } else if (name === 'overview') {
      cam.position.set(-30, 34, 60);
      cam.lookAt(0, 4, 0);
      cam.fov = 52;
    } else { cam.position.set(-9, 7, 14); cam.lookAt(0, 2, 0); cam.fov = 45; }
    cam.updateProjectionMatrix();
  };
  window.setView('row0');

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.body.appendChild(renderer.domElement);
  addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  (function loop() { requestAnimationFrame(loop); renderer.render(scene, cam); })();

  window.__diag = () => {
    const out = [];
    const probe = (name, g) => {
      const p = g.getAttribute('position');
      let nan = 0;
      for (let i = 0; i < p.count; i++) {
        if (!isFinite(p.getX(i)) || !isFinite(p.getY(i)) || !isFinite(p.getZ(i))) nan++;
      }
      out.push(`${name}: ${p.count} verts, ${nan} NaN`);
    };
    probe('leafCard', PL.leafCard(0.1, 0.06, 0.02));
    probe('needleStrip', PL.needleStrip(0.1, 0.01));
    probe('needleSpray', PL.needleSpray(3, 0.1));
    probe('leafCluster', PL.leafCluster(3, 0.1));
    probe('pine', mergeGeos([...PL.buildPine(101).values()]));
    probe('broadleaf', mergeGeos([...PL.buildBroadleaf(211).values()]));
    probe('rock', mergeGeos([...PL.buildRock(11, 'boulder').values()]));
    return out.join('\n');
  };
  window.__gallery = { scene, cam, renderer, items };
</script>
</body>
</html>
